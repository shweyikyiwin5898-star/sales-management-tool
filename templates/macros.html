{% macro icon(name, size=20) -%}
<svg width="{{size}}" height="{{size}}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name=='dashboard' %}<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
{% elif name in ['customers','team'] %}<circle cx="9" cy="8" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M17 5a3 3 0 0 1 0 6m1 4a5 5 0 0 1 3 5"/>
{% elif name in ['followup','clock'] %}<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
{% elif name in ['line','reply','history'] %}<path d="M21 11a9 9 0 0 1-9 9H4l-3 2 1-7a9 9 0 1 1 19-4Z"/><path d="M7 8h9M7 12h6"/>
{% elif name=='settings' %}<path d="M4 7h16M4 17h16"/><circle cx="8" cy="7" r="3" fill="currentColor"/><circle cx="16" cy="17" r="3" fill="currentColor"/>
{% elif name=='plus' %}<path d="M12 5v14M5 12h14"/>
{% elif name=='arrow' %}<path d="m9 5 7 7-7 7"/>
{% elif name=='up-right' %}<path d="M6 18 18 6M6 6h12v12"/>
{% elif name=='search' %}<circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/>
{% elif name=='check' %}<path d="m5 12 4 4L19 6"/>
{% elif name=='close' %}<path d="m6 6 12 12M18 6 6 18"/>
{% elif name=='globe' %}<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/>
{% elif name=='store' %}<path d="M3 9 5 3h14l2 6M4 10v11h16V10M9 21v-7h6v7M3 9c0 4 6 4 6 0 0 4 6 4 6 0 0 4 6 4 6 0"/>
{% elif name=='calendar' %}<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18"/>
{% elif name=='list' %}<path d="M8 6h13M8 12h13M8 18h13M3 6h1M3 12h1M3 18h1"/>
{% elif name=='star' %}<path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/>
{% elif name=='menu' %}<path d="M4 6h16M4 12h16M4 18h16"/>
{% else %}<circle cx="12" cy="12" r="8"/><path d="M12 8v5m0 3h.01"/>{% endif %}</svg>
{%- endmacro %}
{% macro badge(c,t) %}<span class="badge {{c.alert.tone}}"><i></i>{{t(c.alert.key)}}</span>{% endmacro %}
{% macro avatar(c) %}<span class="avatar">{{c.initials}}</span>{% endmacro %}
